[project]
name = "demand-forecast"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "mihneacoman", email = "166476138+mihneacoman@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandera>=0.33.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
demand-forecast = "demand_forecast:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
